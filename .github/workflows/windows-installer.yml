name: Build Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'host/**'
      - 'desktop/**'
      - 'extension/**'
      - 'build-tools/**'
      - 'installer.iss'
      - 'requirements-desktop.txt'
      - '.github/workflows/windows-installer.yml'
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build and smoke test
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: ./build-tools/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: RAINY-Windows-Setup
          path: |
            release/RAINY-Setup.exe
            dist/RAINY/tools/versions.json
            dist/health-report.json
          if-no-files-found: error

      - name: Publish installer release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v2.0.1-build.${{ github.run_number }}"
          gh release create $tag release/RAINY-Setup.exe --target "${{ github.sha }}" --title "RAINY Desktop $tag" --notes "Windows installer with extension-free floating browser download control. Built and smoke-tested on Windows. Browser UI Automation compatibility still requires an interactive user check. Unsigned installer."
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
